<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Routes nest (/work/<slug>), so every relative asset path in this file
         and in site-content.json has to resolve from the root rather than
         from the current route's directory. -->
    <base href="/" />
    <!-- Metadata Titles -->
    <title>Tyler Pixel | Design Engineer</title>
    <meta content="Tyler Pixel | Design Engineer" property="og:title" />
    <meta content="Tyler Pixel | Design Engineer" property="twitter:title" />
    <!-- Metadata Descriptions -->
    <meta content="Brand identity design and product engineering by Tyler Pixel, based in Brisbane, Australia." name="description" />
    <meta content="Brand identity design and product engineering by Tyler Pixel, based in Brisbane, Australia." property="og:description" />
    <!-- Metadata Images -->
    <meta content="https://tylerpixel.com/images/linky-image.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="628" property="og:image:height" />
    <meta content="Tyler Pixel — Design Engineer" property="og:image:alt" />
    <!-- Metadata Misc -->
    <!-- Light's --bg, because light is the site's default whatever the system
         is set to. js/theme.js rewrites this before first paint when the
         stored choice is dark, or is "match system" on a dark system. -->
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@tylerpixel" />
    <meta name="twitter:creator" content="@tylerpixel" />
    <meta property="og:url" content="https://tylerpixel.com" />
    <link rel="canonical" href="https://tylerpixel.com/" />
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <!-- iOS Specific Tags -->
    <meta name="apple-mobile-web-app-title" content="Tyler Pixel" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Fonts -->
    <!-- The design runs on two weights, 500 and 700, and both appear on every
         page — body copy in one, headings and chips in the other — so both core
         faces are preloaded.
         Only the *core* ones. scripts/subset-font.py splits each weight into
         core (ASCII + Latin-1 + the punctuation the site sets) and an extended
         face behind a unicode-range, which the browser fetches only if a glyph
         on the page needs it. Preloading the extended pair would hand back the
         whole saving to every visitor who never sees a character from them —
         which is very nearly all of them. -->
    <link rel="preload" href="/fonts/dmsans-500-core.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dmsans-700-core.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Swapped at deploy time by scripts/inline-content.js: the preload below
         becomes a script element of type application/json, id="siteContent",
         carrying the whole content file — so the document and the site's copy
         arrive in one response and data/site-content.json isn't uploaded at all.
         (Spelled out rather than written as a tag: a literal one here would sit
         inside this comment as text, where anything scanning the file for the
         real element finds it first.) The repo always holds the pre-swap state;
         site.js falls back to fetching the file when the element isn't there,
         which is what local dev runs on. -->
    <!-- content:start -->
    <link rel="preload" href="/data/site-content.json" as="fetch" crossorigin />
    <!-- content:end -->
    <!-- store.js queries the catalogue on every page load, not just on the
         store panel, so the TLS handshake is worth starting now rather than
         letting it land in the middle of the first paint. -->
    <link rel="preconnect" href="https://storefront-api.fourthwall.com" crossorigin />
    <!-- File Links -->
    <!-- The .min files are generated by scripts/build.sh from the hand-edited
         styles/main.css and js/*.js beside them, and ship.sh rebuilds them
         before every deploy. Edit the sources, not these. -->
    <link rel="stylesheet" href="/styles/main.min.css" />
    <link rel="apple-touch-icon" href="/images/webclip.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The one blocking script on the site, and deliberately so: it applies a
         stored dark/light override before the first paint, which a deferred
         script is by definition too late for. It is ~400 bytes minified and
         same-origin, so the parse it blocks is measured in microseconds. -->
    <script src="/js/theme.min.js"></script>
    <!-- Everything else — deferred so all three download during parse but still
         run in order: cuelume defines window.cuelume before site.js reaches for
         it, and store.js sees site.js's helpers already defined. -->
    <script src="/js/cuelume.min.js" defer></script>
    <script src="/js/site.min.js" defer></script>
    <script src="/js/store.min.js" defer></script>
    <!-- Favicon Handling -->
    <link rel="icon" href="/images/favicon.png" type="image/png" />
  </head>

          </h1>
          <!-- Seeded with the value site-content.json holds so it paints with
               the first frame rather than a second after it — this line is the
               LCP element, and rendering it from JS put a ~1s render delay on
               the whole page. renderIdentity() still overwrites it, so the JSON
               stays the source of truth. Kept in sync by scripts/ship.sh. -->
          <h2 id="profileRole">Design Engineer</h2>
        </div>
      </header>

      <div class="section-panels">
        <!-- The only thing in the panel area that needs neither JS nor the
             content file, so it paints with the first frame and holds the
             column's shape while site.min.js is still on the wire. Every panel
             below is `hidden` until JS unhides one, and that gap is what used to
             read as a broken page: a logo, an empty nav pill and nothing else.
             revealPanel() drops the whole container the instant a real panel
             goes up.

             One variant per panel shape, all hidden here: the worker unhides the
             one matching the route on the way out (skeletonFor in
             worker/index.js), so a deep link to a case study is held by a case
             study's silhouette rather than the intro's. It's done at the edge
             because the CSP is `script-src 'self'` with no 'unsafe-inline', so
             an inline picker would be blocked, and an external blocking one
             would cost a round trip before first paint — which is the very
             thing this is here to cover. -->
        <div class="skeleton" id="contentSkeleton" aria-hidden="true">
          <!-- Intro: two runs of copy, then the company-logos strip. -->
          <div data-skeleton="intro" hidden>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-logos">
              <span class="skeleton-bar skeleton-bar--logo"></span>
              <span class="skeleton-bar skeleton-bar--logo"></span>
              <span class="skeleton-bar skeleton-bar--logo"></span>
            </div>
          </div>

          <!-- Selected Works / Store: a page title, then cards that lead with a
               thumbnail. Store thumbs are square, work thumbs 16:9. -->
          <div data-skeleton="work" hidden>
            <span class="skeleton-bar skeleton-bar--title"></span>
            <div class="skeleton-card">
              <span class="skeleton-bar skeleton-bar--thumb"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-card">
              <span class="skeleton-bar skeleton-bar--thumb"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
          </div>

          <div data-skeleton="store" hidden>
            <span class="skeleton-bar skeleton-bar--title"></span>
            <div class="skeleton-card">
              <span class="skeleton-bar skeleton-bar--thumb skeleton-bar--square"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-card">
              <span class="skeleton-bar skeleton-bar--thumb skeleton-bar--square"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
          </div>

          <!-- Case study: hero, title, the five-line meta header, then a lede
               set larger than the body copy under it. -->
          <div data-skeleton="work-detail" hidden>
            <span class="skeleton-bar skeleton-bar--row skeleton-bar--short"></span>
            <span class="skeleton-bar skeleton-bar--thumb"></span>
            <span class="skeleton-bar skeleton-bar--title"></span>
            <div class="skeleton-meta">
              <span class="skeleton-bar skeleton-bar--row"></span>
              <span class="skeleton-bar skeleton-bar--row"></span>
              <span class="skeleton-bar skeleton-bar--row"></span>
              <span class="skeleton-bar skeleton-bar--row"></span>
              <span class="skeleton-bar skeleton-bar--row"></span>
            </div>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--lede"></span>
              <span class="skeleton-bar skeleton-bar--lede"></span>
            </div>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
          </div>

          <!-- About: portrait beside the greeting, copy, then the resume rows. -->
          <div data-skeleton="about" hidden>
            <span class="skeleton-bar skeleton-bar--title"></span>
            <div class="skel-portrait">
              <span class="skeleton-bar skeleton-bar--portrait"></span>
              <span class="skeleton-bar skeleton-bar--pill"></span>
            </div>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-meta">
              <span class="skeleton-bar skeleton-bar--row"></span>
              <span class="skeleton-bar skeleton-bar--row"></span>
              <span class="skeleton-bar skeleton-bar--row"></span>
            </div>
          </div>

          <!-- Everything else — Writing's empty state, the legal documents, and
               any path the router will resolve to the 404. -->
          <div data-skeleton="prose" hidden>
            <span class="skeleton-bar skeleton-bar--title"></span>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
            <div class="skeleton-para">
              <span class="skeleton-bar skeleton-bar--line"></span>
              <span class="skeleton-bar skeleton-bar--line"></span>
            </div>
          </div>
        </div>
        <section class="panel t-stagger" data-panel="intro" id="panel-intro" hidden></section>
        <section class="panel t-stagger" data-panel="work" id="panel-work" hidden></section>
        <section class="panel t-stagger" data-panel="writing" id="panel-writing" hidden></section>
        <section class="panel t-stagger" data-panel="contact" id="panel-contact" hidden></section>
        <section class="panel t-stagger" data-panel="store" id="panel-store" hidden></section>
        <!-- Detail panels aren't nav tabs — each is only reachable by clicking a
             card on its parent listing panel. -->
        <section class="panel t-stagger" data-panel="work-detail" id="panel-work-detail" hidden></section>
        <section class="panel t-stagger" data-panel="store-detail" id="panel-store-detail" hidden></section>
        <section class="panel t-stagger" data-panel="writing-detail" id="panel-writing-detail" hidden></section>
        <!-- Terms / Privacy / Returns all render into this one panel. -->
        <section class="panel t-stagger" data-panel="legal" id="panel-legal" hidden></section>
        <!-- Shown by the router for any path that matches nothing. The GIF
             reuses .work-thumb so it sits in the same frame as a Selected
             Works thumbnail. -->
        <section class="panel t-stagger" data-panel="notfound" id="panel-404" hidden>
          <!-- loading="lazy" matters more here than anywhere else on the site:
               a hidden panel is still eager-loaded, so without it every visitor
               downloaded this animation for a panel almost none of them will
               ever see — mid-flight against the CSS, the fonts and the content
               JSON.
               It is animated WebP rather than the 669 KiB GIF it started as:
               same 33 frames at the same 453x255, a third of the bytes.
               scripts/resize-images.js converts it; images/404.gif stays in the
               repo as the source and is kept out of the upload. It is not
               downscaled — 453px in a 360px column is already under 2x. -->
          <img class="work-thumb notfound-thumb" src="/images/404.webp" alt="A lone figure walking away across an empty desert" loading="lazy" decoding="async" width="453" height="255" />
          <p class="notfound-title">404 Error</p>
          <p class="notfound-message">This page does not exist.</p>
          <a class="notfound-home cta-button" href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
            Back to homepage
          </a>
        </section>
      </div>

      <!-- Site footer — sits below every panel, so it's part of the shell
           rather than any one panel's content. The wordmark is cloned from the
           header by renderSiteFooter() instead of being repeated here (the path
           is ~3.5 KiB), and the build chip and social icons are both filled
           from site-content.json. -->
      <!-- Hidden until renderSiteFooter() fills it. Every part of it comes from
           JS — the wordmark is cloned from the header, the chip and icons from
           the content file — so before that it renders as a bare hairline with
           nothing above it, which shows up under the loading skeleton as a
           stray rule. -->
      <footer class="site-footer t-stagger" hidden>
        <!-- Decorative repeat of the h1 wordmark above — hidden from the
             accessibility tree so it isn't announced as a second heading. -->
        <div class="footer-mark" id="siteFooterMark" aria-hidden="true"></div>
        <div class="footer-rules">
          <span class="footer-rule"></span>
          <a class="footer-version" id="siteFooterVersion" href="https://github.com/tylerpixel/project-upscale" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
        <div class="footer-meta">
          <p class="footer-copy" id="siteFooterCopyright"></p>
          <nav class="identity-links" id="siteFooterSocial" aria-label="Social"></nav>
        </div>
      </footer>
    </main>

    <div class="attribution">
      <a href="/images/404.webp" class="light-link">GIF</a> by HBO /
      <a href="https://creativecommons.org/licenses/by/2.0/" class="light-link" target="_blank" rel="noopener noreferrer">CC BY</a>
    </div>

    <!-- Settings — a dot pinned to the bottom-left corner of the viewport with
         the site's two preferences and its keyboard shortcuts folded up inside
         it. Fixed to the corner rather than attached to the nav so it stays out
         of the way of the content column at any width.

         Desktop only, and CSS gates it on a real pointer and keyboard plus the
         room the panel needs. The shortcuts half would be a lie on a phone, and
         the settings half has nothing to say there either: sound is desktop-only
         for the same reason (see initSounds in js/site.js), and a phone's theme
         already follows the system without being asked.

         Opened by click rather than hover, unlike the read-only panel this
         replaced: it holds controls now, and a panel you can only reach by
         keeping a pointer on it is one a keyboard can never operate. Ships
         hidden and is unhidden by initNav(), so it can't sit in the corner
         under the loading skeleton offering shortcuts to pages that don't
         exist yet.

         The shortcuts list is two rows only: the numbered page shortcuts live
         inside what ⌘K opens, beside the pages they reach, instead of being
         listed twice. -->
    <div class="settings" id="settings" hidden>
      <!-- role="group", not "dialog": nothing here is modal and focus is never
           trapped, so announcing a dialog would promise a layer to escape from
           that doesn't exist. The nub's aria-expanded/aria-controls is what
           says this is a thing that opens. -->
      <div class="settings-panel" id="settingsPanel" role="group" aria-label="Settings">
        <div class="settings-group">
          <p class="settings-title" id="settingsThemeLabel">Theme</p>
          <!-- A radiogroup rather than three buttons: they're one setting with
               three values, and arrow keys should move between them. -->
          <div class="settings-segment" role="radiogroup" aria-labelledby="settingsThemeLabel">
            <button class="settings-option" type="button" role="radio" aria-checked="false" data-theme-choice="light" aria-label="Light">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
            </button>
            <button class="settings-option" type="button" role="radio" aria-checked="false" data-theme-choice="dark" aria-label="Dark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>
            </button>
            <button class="settings-option" type="button" role="radio" aria-checked="false" data-theme-choice="system" aria-label="Match system">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
            </button>
          </div>
        </div>

        <div class="settings-group settings-group--row">
          <p class="settings-title" id="settingsSoundLabel">Sound</p>
          <button class="settings-switch" type="button" role="switch" aria-checked="true" id="soundToggle" aria-labelledby="settingsSoundLabel">
            <span class="switch-thumb"></span>
          </button>
        </div>

        <!-- aria-hidden because it's a picture of a keyboard, not a control;
             every shortcut in it works whether or not the panel is open. -->
        <div class="settings-group" aria-hidden="true">
          <p class="settings-title">Shortcuts</p>
          <ul class="shortcuts-list">
            <li class="shortcuts-row">
              <span class="shortcuts-keys"><span class="shortcuts-key shortcuts-key--wide" data-key="k">⌘K</span></span>
              <span class="shortcuts-label">Jump to</span>
            </li>
            <li class="shortcuts-row">
              <span class="shortcuts-keys">
                <span class="shortcuts-key" data-key="ArrowLeft">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
                </span>
                <span class="shortcuts-key" data-key="ArrowRight">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
                </span>
              </span>
              <span class="shortcuts-label">Step</span>
            </li>
          </ul>
        </div>
      </div>
      <button class="settings-nub" id="settingsNub" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9M14 17H5" /><circle cx="17" cy="17" r="3" /><circle cx="7" cy="7" r="3" /></svg>
      </button>
    </div>

    <!-- Bottom nav — fixed overlay, sits outside .site so it never shifts with content -->
    <div class="navwrap">
      <!-- Name chip for keyboard navigation. One chip for the whole bar rather
           than a toast per tab: stepping quickly used to leave a trail of them
           timing out one after another, because each tab was running its own
           1.2s clock. This has a single clock that restarts on every press, and
           the name inside it changes.

           Anchored above .navwrap rather than above the nav pill so it clears
           the Next/Previous row when a case study puts one there, and centred
           on .navwrap, which is centred on the page — the pill itself sits off
           centre by the width of the FAB beside it. aria-hidden for the same
           reason the tab toasts are: the route change is already announced. -->
      <div class="nav-flash" id="navFlash" aria-hidden="true">
        <span class="flash-label" id="navFlashLabel"></span>
      </div>

      <!-- Only shown on a work item's case study — jumps straight to the
           neighboring project. Hidden elsewhere (see updateWorkNav in site.js). -->
      <div class="work-nav" id="workNavRow" hidden>
        <button class="work-nav-btn work-nav-prev" id="workPrevBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
          <span class="work-nav-label"></span>
        </button>
        <button class="work-nav-btn work-nav-next" id="workNextBtn" type="button">
          <span class="work-nav-label"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
        </button>
      </div>
      <div class="navwrap-row">
        <nav class="nav" role="tablist" aria-label="Sections" id="navTabs">
          <span class="nav-ind" id="navInd"></span>
          <!-- Keyboard-focus thumb. One element that slides between the tabs
               rather than a ring appearing on each in turn, so moving along the
               bar reads as one marker travelling. Positioned by initNav. -->
          <span class="nav-focus" id="navFocus" aria-hidden="true"></span>
          <!-- Placeholders for the five tabs, which are built from the content
               file. initNav() removes them before it measures anything, so the
               sliding indicator never sees them. -->
          <span class="nav-skeleton" aria-hidden="true"></span>
          <span class="nav-skeleton" aria-hidden="true"></span>
          <span class="nav-skeleton" aria-hidden="true"></span>
          <span class="nav-skeleton" aria-hidden="true"></span>
          <span class="nav-skeleton" aria-hidden="true"></span>
        </nav>
        <!-- Two icon weights stacked in one grid cell, the same arrangement the
             nav tabs use, so the cross-fade on hover rides on .nav-icon and
             needs no rules of its own beyond the .fab:hover pair.
             The solid path is the outline path with its inner cutout dropped —
             the second subpath, `m0,192…` — so the two weights are guaranteed to
             be the same bubble at the same size rather than two drawings that
             merely resemble each other. -->
        <a class="fab" id="navFab" aria-label="Message">
          <svg class="nav-icon nav-icon--line" width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
            <path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Zm0,192a87.87,87.87,0,0,1-44.06-11.81,8,8,0,0,0-6.54-.67L40,216,52.47,178.6a8,8,0,0,0-.66-6.54A88,88,0,1,1,128,216Z" />
          </svg>
          <svg class="nav-icon nav-icon--solid" width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
            <path d="M128,24A104,104,0,0,0,36.18,176.88L24.83,210.93a16,16,0,0,0,20.24,20.24l34.05-11.35A104,104,0,1,0,128,24Z" />
          </svg>
          <span class="nav-toast">Message</span>
        </a>
      </div>
    </div>

    <!-- The stowed bar. Press and hold the nav and it shrinks into this, which
         then follows your finger and settles against whichever side of the
         screen you let go nearest; tapping it puts the bar back. See
         initNavStow() in js/site.js.

         A sibling of .navwrap rather than a child, because the two are placed
         by different rules — the bar is centred on the bottom of the viewport
         and the orb is wherever it was last dropped, which is a position
         .navwrap's own centring transform would fight.

         The glyph is written in by JS: it wears whichever section you're in,
         so the orb says where you are as well as what it opens. Empty here for
         the same reason the nav tabs are — the icon follows the route, and a
         hardcoded one would be wrong the moment you moved. -->
    <button class="nav-orb" id="navOrb" type="button" aria-label="Show the navigation bar" hidden>
      <span class="orb-icon" id="navOrbIcon" aria-hidden="true"></span>
    </button>

    <!-- Tray — fixed bottom sheet shared by the cart and the message form.
         One view is shown at a time; openTray(view, title) in site.js swaps them. -->
    <div class="tray-overlay" id="trayOverlay" hidden>
      <div class="tray-sheet" role="dialog" aria-modal="true" aria-label="Cart" id="traySheet">
        <div class="tray-head">
          <p class="page-title" id="trayTitle">Cart</p>
          <button class="tray-close" id="trayClose" type="button" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
              <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
            </svg>
          </button>
        </div>

        <!-- Booking view — what "Work with me" opens. The cal.com inline embed
             mounts into the div below; the loader that mounts it lives in
             js/site.js rather than in an inline <script> here, because the CSP
             is `script-src 'self'` with no 'unsafe-inline' and an inline block
             would simply be refused. It runs on first open, so nothing of
             cal's is fetched by a visitor who never asks to book. -->
        <div class="tray-view" data-view="book" hidden>
          <div class="cal-embed" id="my-cal-inline-30min"></div>
        </div>

        <!-- Jump view — what ⌘K opens. The rows are the bar's own tabs plus the
             message FAB, each carrying the digit that reaches it directly, so
             the palette both goes places and teaches the shortcuts. Built by
             initNav(); empty here because the tab list is content. -->
        <div class="tray-view" data-view="jump" hidden>
          <div class="jump-list t-stagger" id="jumpList">
            <!-- The same travelling thumb as the bar's, turned on its side.
                 First child so it paints under the rows. -->
            <span class="jump-focus" id="jumpFocus" aria-hidden="true"></span>
          </div>
        </div>

        <!-- Cart view -->
        <div class="tray-view" data-view="cart" hidden>
          <div class="cart-items" id="cartItems"></div>
          <div class="cart-foot" id="cartFoot">
            <div class="cart-total-row">
              <span class="cart-total-label">Total</span>
              <span class="cart-total" id="cartTotal">$0.00</span>
            </div>
            <button class="cart-checkout" id="cartCheckout" type="button">Checkout</button>
            <button class="cart-purge" id="cartPurge" type="button" hidden>Remove unavailable items</button>
            <p class="cart-note">Secure checkout is handled by Fourthwall.</p>
          </div>
        </div>

        <!-- Message view — multi-step form behind the nav FAB -->
        <div class="tray-view" data-view="message" hidden>
          <form class="msg-form" id="msgForm" novalidate>
            <div class="msg-step" data-step="name">
              <label class="msg-label" for="msgName">What's your name?</label>
              <input class="msg-input" id="msgName" name="name" type="text" autocomplete="name" placeholder="Your name" />
            </div>
            <div class="msg-step" data-step="email" hidden>
              <label class="msg-label" for="msgEmail">Where can I reach you?</label>
              <input class="msg-input" id="msgEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="msg-step" data-step="message" hidden>
              <label class="msg-label" for="msgBody">What's on your mind?</label>
              <textarea class="msg-input msg-textarea" id="msgBody" name="message" rows="4" placeholder="Your message"></textarea>
            </div>
            <div class="msg-step msg-done" data-step="done" hidden>
              <p class="msg-done-title" id="msgDoneTitle">Message sent</p>
              <p class="msg-done-note" id="msgDoneNote"></p>
            </div>
            <!-- Honeypot — visually hidden; the server ignores submissions that fill it -->
            <div class="msg-hp" aria-hidden="true">
              <label for="msgCompany">Company</label>
              <input id="msgCompany" name="company" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <p class="msg-error" id="msgError"></p>
            <div class="msg-foot" id="msgFoot">
              <button class="msg-next" id="msgNext" type="submit">Next</button>
              <div class="msg-foot-row">
                <button class="msg-back" id="msgBack" type="button" hidden>← Back</button>
                <span class="msg-progress" id="msgProgress">1 of 3</span>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Lightbox — full-size image viewer opened from a work item's gallery.
         Cycles through that project's images via the arrows, arrow keys, or
         Escape to close. -->
    <div class="lightbox-overlay" id="lightboxOverlay" hidden>
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor">
          <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z" />
        </svg>
      </button>
      <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
      </button>
      <figure class="lightbox-figure">
        <img class="lightbox-image" id="lightboxImage" alt="" />
        <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
      </figure>
      <button class="lightbox-arrow lightbox-next" id="lightboxNext" type="button" aria-label="Next image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg>
      </button>
      <span class="lightbox-counter" id="lightboxCounter"></span>
    </div>

  </body>
</html>
